services:
  account-auto-scheduler:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTO_SCHEDULER_ONLINE_DATABASE_URL: ${AUTO_SCHEDULER_ONLINE_DATABASE_URL:-}
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - account-auto-scheduler-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  account-auto-scheduler-data:
